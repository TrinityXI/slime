# 评测数据集路径: /work/projects/polyullm/llm-eval/datasets
MMLU-Pro:
  local_path: /work/projects/polyullm/llm-eval/datasets/MMLU-Pro
  # split [Optional]: 对应hugginface dataset的split字段，默认不加split字段，读取数据集所有数据，
  # 如果需要指定split则加该字段 (例如MMLU-Pro有validation和test两个split，则指定split为test)
  split: test
  prompt_key: question
MMLU:
  local_path: /work/projects/polyullm/llm-eval/datasets/mmlu
  # subset [Optional]: 对应hugginface dataset的subset字段，默认不加subset字段
  # 如果需要指定subset则加该字段 (例如MMLU有多个subset，则指定subset为all)
  subset: all
  split: test
  prompt_key: question
